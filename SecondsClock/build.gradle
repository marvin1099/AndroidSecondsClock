// Module build file
plugins {
    id 'com.android.application'
}

// git data for timestamp in code
def gitdata1 = new ByteArrayOutputStream()
def gitdata2 = new ByteArrayOutputStream()
def gitdata3 = new ByteArrayOutputStream()
// change this line to /* if not using git
exec {
    commandLine "git", "--no-pager", "show", "-s",
            "--format=from commit %H"
    standardOutput = gitdata1
}
exec {
    commandLine "git", "--no-pager", "show", "-s",
            "--date=format:%H:%M:%S GMT%z %a %b %d %Y",
            "--format=of %ad"
    standardOutput = gitdata2
}
exec {
    commandLine "git", "branch", "--show-current"
    standardOutput = gitdata3
}

// Launcher icon is checked in at src/main/res/drawable/ic_launcher.png and
// rasterized from seconds-clock-icon.svg in this module directory.

// Update these three to make new version
def VERSIONCODE = 10
def VERSIONNAME = "2.6"

def keystorePropertiesFile = rootProject.file("local/keystore.properties")
if (!keystorePropertiesFile.exists()) {
    keystorePropertiesFile = rootProject.file("../Keys/keystore.properties")
}
def keystoreProperties = new Properties()
def hasReleaseSigningKey = keystorePropertiesFile.isFile()
if (hasReleaseSigningKey) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdkVersion 28

    signingConfigs {
        if (hasReleaseSigningKey) {
            config {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    defaultConfig {
        applicationId "com.marvin1099.secondsclock"
        versionCode VERSIONCODE
        versionName VERSIONNAME
        minSdk 26
        //noinspection ExpiredTargetSdkVersion
        targetSdk 26
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (hasReleaseSigningKey) {
                signingConfig signingConfigs.config
            }
            resValue("string", 'build_time', "${(new Date()).toString()}")
            resValue("string", 'build_git1', "${gitdata1.toString()}")
            resValue("string", 'build_git2', "${gitdata2.toString()}")
            resValue("string", 'build_git3',
                    "${" on branch " + gitdata3.toString()}")
        }
        debug {
            resValue("string", 'build_time', "${(new Date()).toString()}")
            resValue("string", 'build_git1', "${gitdata1.toString()}")
            resValue("string", 'build_git2', "${gitdata2.toString()}")
            resValue("string", 'build_git3',
                    "${" on branch " + gitdata3.toString()}")
            applicationIdSuffix ".debug"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'uk.co.yahoo.p1rpp.secondsclock'
}

dependencies {
    implementation 'com.google.android.material:material:1.4.0'
}
